[package]
name = "translit"
version = "0.2.0"
edition = "2021"
description = "Игровой словарь с DirectX 11 захватом"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["bmp", "png", "jpeg"] }
sha2 = "0.10"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
tokio = { version = "1", features = ["time"] }
getrandom = "0.3"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController", "Win32_System_JobObjects", "Win32_System_Threading"] }
